name: Changefence

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changefence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Enforce trusted change policy
        uses: nintechio/changefence@v1
